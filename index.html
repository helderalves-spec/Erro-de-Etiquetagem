<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4-kttLAn-QvxF7LIX-BMtTfCcz5HLnuk",
            authDomain: "erro-de-etiquetagem.firebaseapp.com",
            projectId: "erro-de-etiquetagem",
            storageBucket: "erro-de-etiquetagem.firebasestorage.app",
            messagingSenderId: "924044206334",
            appId: "1:924044206334:web:b1faf5bc9c94eb04c305af"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colErros = collection(db, "erros_bipados");
        const SENHA_LIDERANCA = "admin2846";

        let baseDeDados = new Map();
        let resumoOperadores = {};
        let errosRegistrados = [];
        let paginaAtiva = 'receive';
        const listaCoresBolinhas = ['#ff5722', '#9b59b6', '#3498db', '#f1c40f', '#1abc9c', '#e67e22', '#2ecc71', '#34495e'];

        function obterCorEscalaCalor(porcentagem) {
            const p = parseFloat(porcentagem);
            if (isNaN(p) || p <= 0) return "#2ed573";
            if (p < 5) return "#2ed573";
            if (p < 15) return "#ffa502";
            if (p < 25) return "#ff7f50";
            return "#d63031";
        }

        // Recupera a planilha salva localmente para evitar estourar o limite de 1MB do Firestore
        function carregarBaseLocal() {
            try {
                const baseSalva = localStorage.getItem("spx_local_base");
                const resumoSalvo = localStorage.getItem("spx_local_resumo");
                if (baseSalva && resumoSalvo) {
                    baseDeDados = new Map(JSON.parse(baseSalva));
                    resumoOperadores = JSON.parse(resumoSalvo);
                    document.getElementById('status-msg').innerHTML = `🟢 Base Operacional ativa na memória (${baseDeDados.size} pacotes).`;
                } else {
                    document.getElementById('status-msg').innerHTML = "⚠️ Nenhuma Base Operacional ativa. Importe um arquivo CSV.";
                }
            } catch(e) {
                console.error("Erro ao ler localStorage", e);
            }
        }
        carregarBaseLocal();

        function processarContagemErros() {
            Object.keys(resumoOperadores).forEach(op => { resumoOperadores[op].erros = 0; });
            errosRegistrados.forEach(e => {
                if (!resumoOperadores[e.op]) resumoOperadores[e.op] = { total: 0, erros: 0 };
                resumoOperadores[e.op].erros++;
            });
        }

        onSnapshot(query(colErros, orderBy("timestamp", "desc")), (snapshot) => {
            errosRegistrados = [];
            snapshot.forEach((doc) => { errosRegistrados.push({ id_nuvem: doc.id, ...doc.data() }); });
            processarContagemErros();
            document.getElementById('cloud-status').innerHTML = "🟢 ONLINE";
            
            // Força a atualização da tela atual em tempo real quando o banco mudar
            atualizarTelasDinamicas();
        });

        // Função auxiliar para atualizar a interface dependendo de onde o usuário está
        function atualizarTelasDinamicas() {
            if (paginaAtiva === 'audit') renderizarPerformance();
            if (paginaAtiva === 'diario') renderizarHistoricoDiario();
            if (paginaAtiva === 'bipar') renderizarBipsRecentes();
        }

        window.processarBip = async function(e) {
            if (e.key === "Enter") {
                const code = e.target.value.trim();
                e.target.value = ""; if (!code) return;
                const op = baseDeDados.get(code) || "Não Encontrado na Base";
                try {
                    await addDoc(colErros, { op, code, data: new Date().toLocaleDateString('pt-BR'), hora: new Date().toLocaleTimeString('pt-BR'), timestamp: Date.now() });
                } catch (err) { console.error(err); }
            }
        }

        window.copiarCodigosBipados = function() {
            if (errosRegistrados.length === 0) {
                alert("Nenhum código registrado para copiar.");
                return;
            }
            const listaCodigos = errosRegistrados.map(e => e.code).join('\n');
            navigator.clipboard.writeText(listaCodigos).then(() => {
                alert("Todos os códigos BR foram copiados com sucesso!");
            }).catch(err => {
                console.error("Erro ao copiar", err);
            });
        }

        window.renderizarPerformance = function() {
            const tbodyEsq = document.querySelector('#tabela-perf-esquerda tbody');
            const tbodyDir = document.querySelector('#tabela-perf-direita tbody');
            if(!tbodyEsq || !tbodyDir) return;
            
            let tVal = 0, tErr = 0;
            
            const dados = Object.entries(resumoOperadores).sort((a, b) => b[1].total - a[1].total);
            dados.forEach(([_, d]) => { tVal += d.total; tErr += d.erros; });

            const metadeIndex = Math.ceil(dados.length / 2);
            const metadeEsquerda = dados.slice(0, metadeIndex);
            const metadeDireita = dados.slice(metadeIndex);

            const mapearLinhas = (lista, offsetOriginal) => {
                return lista.map(([nome, d], index) => {
                    const indiceCor = offsetOriginal + index;
                    const ac = d.total > 0 ? (((d.total - d.erros) / d.total) * 100).toFixed(1) : "0.0";
                    let color = ac >= 95 ? "#2ed573" : (ac >= 90 ? "#ffa502" : "#d63031");
                    return `<tr>
                        <td class="col-left" style="font-weight:600;"><span class="bullet-dot" style="background:${listaCoresBolinhas[indiceCor%8]}"></span>${nome}</td>
                        <td style="color:#475569; font-weight:600;">${d.total}</td>
                        <td class="${d.erros > 0 ? 'badge-error' : 'badge-zero-error'}">${d.erros}</td>
                        <td>
                            <div class="progress-container">
                                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${ac}%; background:${color}"></div></div>
                                <div class="progress-text">${ac}%</div>
                            </div>
                        </td>
                    </tr>`;
                }).join('');
            };

            tbodyEsq.innerHTML = mapearLinhas(metadeEsquerda, 0);
            tbodyDir.innerHTML = mapearLinhas(metadeDireita, metadeIndex);

            document.getElementById('kpi-total-validado').innerText = tVal.toLocaleString();
            document.getElementById('kpi-total-erros').innerText = tErr.toLocaleString();
            document.getElementById('kpi-acuracidade-geral').innerText = tVal > 0 ? (((tVal - tErr) / tVal) * 100).toFixed(1) + "%" : "100%";

            document.getElementById('card-master-validado').innerText = tVal.toLocaleString();
            document.getElementById('card-master-erros').innerText = tErr.toLocaleString();
            document.getElementById('card-master-acuracidade').innerText = tVal > 0 ? (((tVal - tErr) / tVal) * 100).toFixed(1) + "%" : "100%";
        }

        window.renderizarHistoricoDiario = function() {
            const container = document.getElementById('container-historico');
            if (!container) return;
            container.innerHTML = "";
            const hist = {};
            const conjuntoOperadoresComErro = new Set();

            errosRegistrados.forEach(e => {
                if (!hist[e.data]) hist[e.data] = {};
                hist[e.data][e.op] = (hist[e.data][e.op] || 0) + 1;
                conjuntoOperadoresComErro.add(e.op);
            });

            const datas = Object.keys(hist).sort((a,b) => b.split('/').reverse().join('') - a.split('/').reverse().join(''));
            
            document.getElementById('kpi-hist-erros').innerText = errosRegistrados.length;
            document.getElementById('kpi-hist-operadores-erro').innerText = conjuntoOperadoresComErro.size;

            datas.forEach(data => {
                const ops = hist[data];
                const totalDia = Object.values(ops).reduce((a,b) => a+b, 0);
                container.innerHTML += `
                    <div class="report-container" style="margin-bottom:20px;">
                        <div class="date-header-bar"><span>📅 DATA DO LOG: ${data}</span><span>Total de Erros no Dia: ${totalDia}</span></div>
                        <div class="table-wrapper">
                            <table class="hist-table">
                                <thead><tr><th class="col-left">Operador</th><th>Quantidade de Erros</th><th style="text-align: right; padding-right: 25px;">Participação no Erro (% do Dia)</th></tr></thead>
                                <tbody>
                                    ${Object.entries(ops).sort((a,b)=>b[1]-a[1]).map(([nome, qtd], i) => {
                                        const perc = ((qtd / totalDia) * 100).toFixed(1);
                                        const color = obterCorEscalaCalor(perc);
                                        return `<tr>
                                            <td class="col-left" style="font-weight:600;"><span class="bullet-dot" style="background:${listaCoresBolinhas[i%8]}"></span>${nome}</td>
                                            <td class="badge-error">${qtd}</td>
                                            <td><div class="progress-container"><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${perc}%; background:${color}"></div></div><div class="progress-text">${perc}%</div></div></td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>`;
            });
        }

        window.renderizarBipsRecentes = function() {
            const tbody = document.querySelector('#tabela-recente tbody');
            if (tbody) {
                tbody.innerHTML = errosRegistrados.slice(0, 50).map(e => `<tr><td>${e.hora}</td><td style="font-family:monospace; font-weight:600;">${e.code}</td><td><button class="btn-utility" style="color:#e74c3c; border:none; padding:4px 8px;" onclick="deletarBipIndividual('${e.id_nuvem}')">🗑️</button></td></tr>`).join('');
            }
        }

        window.deletarBipIndividual = async (id) => { if(confirm("Remover?")) await deleteDoc(doc(db, "erros_bipados", id)); };

        window.resetarPaginaBips = async () => { if(confirm("Limpar bips da nuvem?")) { (await getDocs(colErros)).forEach(async d => await deleteDoc(d.ref)); } };

        // ATUALIZADO: CORRETOR LINEAR DE ALTO DESEMPENHO COM REFRESH EM TEMPO REAL
        window.lerArquivo = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            document.getElementById('status-msg').innerHTML = "⏳ Processando base de dados gigante... Aguarde.";
            
            reader.onload = function(e) {
                const textoCompleto = e.target.result;
                
                const primeiraQuebra = textoCompleto.indexOf('\n');
                if (primeiraQuebra === -1) return;
                const cabecalhoLinha = textoCompleto.substring(0, primeiraQuebra);
                const div = cabecalhoLinha.includes(';') ? ';' : ',';
                
                const cab = cabecalhoLinha.split(div);
                const colT = cab.findIndex(c => c.trim().includes('SPX Tracking Number'));
                const colO = cab.findIndex(c => c.trim().toLowerCase().includes('operator'));
                
                if (colT === -1) {
                    document.getElementById('status-msg').innerHTML = "❌ Coluna 'SPX Tracking Number' não localizada no CSV.";
                    return;
                }

                baseDeDados.clear();
                resumoOperadores = {};
                
                let cursorIndex = primeiraQuebra + 1;
                let finalTexto = textoCompleto.length;

                // Processamento linear (Evita estouro de memória RAM)
                while (cursorIndex < finalTexto) {
                    let proximaQuebra = textoCompleto.indexOf('\n', cursorIndex);
                    if (proximaQuebra === -1) proximaQuebra = finalTexto;
                    
                    let linhaStr = textoCompleto.substring(cursorIndex, proximaQuebra).trim();
                    cursorIndex = proximaQuebra + 1;

                    if (!linhaStr) continue;

                    let col = linhaStr.split(div);
                    if (col[colT]) {
                        let track = col[colT].trim();
                        let op = col[colO] ? col[colO].replace(/\[.*?\]/, '').trim() : "Desconhecido";
                        
                        baseDeDados.set(track, op);
                        
                        if (!resumoOperadores[op]) {
                            resumoOperadores[op] = { total: 0, erros: 0 };
                        }
                        resumoOperadores[op].total++;
                    }
                }
                
                try {
                    // Salva no navegador
                    localStorage.setItem("spx_local_base", JSON.stringify(Array.from(baseDeDados.entries())));
                    localStorage.setItem("spx_local_resumo", JSON.stringify(resumoOperadores));

                    document.getElementById('status-msg').innerHTML = `✅ Planilha de ${baseDeDados.size} linhas carregada com sucesso!`;
                    
                    // --- GATILHOS DE ATUALIZAÇÃO EM TEMPO REAL ---
                    processarContagemErros(); // Re-cruza os bips existentes com a nova lista de operadores
                    atualizarTelasDinamicas(); // Força as tabelas visuais a atualizarem imediatamente
                    
                } catch (erroStorage) {
                    console.error(erroStorage);
                    document.getElementById('status-msg').innerHTML = "❌ Erro ao salvar dados no navegador. Arquivo excessivamente grande.";
                }
            };
            reader.readAsText(file, "UTF-8");
        };

        window.resetarBaseLocal = async () => { 
            if(confirm("Deseja apagar a Base Operacional salva neste computador?")) { 
                localStorage.removeItem("spx_local_base");
                localStorage.removeItem("spx_local_resumo");
                baseDeDados.clear();
                resumoOperadores = {};
                document.getElementById('csv-file').value = "";
                document.getElementById('status-msg').innerHTML = "⚠️ Base local removida.";
                processarContagemErros();
                atualizarTelasDinamicas();
            } 
        };

        window.showPage = (id, btn) => {
            if ((id === 'audit' || id === 'diario') && prompt("🔒 Senha:") !== SENHA_LIDERANCA) return;
            paginaAtiva = id;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active'); btn.classList.add('active');
            if (id === 'bipar') { renderizarBipsRecentes(); setTimeout(() => document.getElementById('scanner').focus(), 80); }
            if (id === 'audit') renderizarPerformance();
            if (id === 'diario') renderizarHistoricoDiario();
        };

        window.limparTudo = async () => { 
            if(prompt("Senha Master:") === SENHA_LIDERANCA) { 
                const bips = await getDocs(colErros);
                bips.forEach(async d => await deleteDoc(d.ref)); 
                localStorage.removeItem("spx_local_base");
                localStorage.removeItem("spx_local_resumo");
                location.reload(); 
            } 
        };
    </script>
